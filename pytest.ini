[pytest]
testpaths = tests

markers =
    smoke: pre-deploy. Quick and reliable.
    scan: scheduled bug-detection job against a sample of public pages from sitemap.
    quarantine: known flaky. Still runs, but never blocks a merge.

addopts =
    --strict-markers
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --output test-results