name: Weekly page scan

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ vars.BASE_URL }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scan sampled pages
        run: pytest -m scan --tracing off --html=reports/scan-report.html --self-contained-html

      - name: Show findings on the run page
        if: always()
        run: cat reports/scan-findings.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scan-results
          path: reports/
          retention-days: 30